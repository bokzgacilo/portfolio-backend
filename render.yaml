# Render Blueprint. Point Render at the repo holding this directory and it
# reads this file instead of asking for build and start commands.
services:
  - type: web
    name: background-remover-api
    runtime: python
    plan: free
    # Drop this line if backend/ is the repo root rather than a subdirectory.
    rootDir: backend
    # The model is fetched during the build, so the first live request does not
    # pay for a 5 MB download on top of inference.
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python -c "from rembg import new_session; import os; new_session(os.getenv('REMBG_MODEL', 'u2netp'))"
    # One worker on purpose: the free instance has 512 MB, and each worker
    # loads its own copy of the model.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Written at build time and read at runtime from the same disk.
      - key: REMBG_HOME
        value: /opt/render/project/src/backend/.rembg
      - key: REMBG_MODEL
        value: u2netp
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: MAX_DIMENSION
        value: "2000"
      # Set this to the Vercel production domains that may call the API.
      - key: ALLOWED_ORIGINS
        value: https://www.bokzgacilo.com,https://bokzgacilo.com,http://localhost:3000,http://127.0.0.1:3000
